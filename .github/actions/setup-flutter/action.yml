name: Set up Flutter
description: Install the pinned Flutter SDK and fetch the app's packages.
runs:
  using: composite
  steps:
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        # Keep equal to the local `flutter --version`.
        flutter-version: "3.44.7"
        channel: stable
        cache: true
    - name: Install dependencies
      shell: bash
      run: flutter pub get
