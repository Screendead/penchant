name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - master
concurrency:
  # Queued, not cancelled: GitHub keeps only the newest pending run, so the newest commit always deploys last.
  group: hosting-live
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  build_and_deploy:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      - name: Build
        run: flutter build web --release
      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SCREENDEAD_VICE_TRACKER }}
          channelId: live
          projectId: screendead-vice-tracker
