name: Probe keychain
on:
  push:
    branches:
      - ci/mac-e2e
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - run: |
          mkdir p && cd p
          cat > k.swift <<'SW'
          import Foundation
          import Security
          let mode = CommandLine.arguments.count > 1 ? CommandLine.arguments[1] : "dp"
          var q: [String: Any] = [
            kSecClass as String: kSecClassGenericPassword,
            kSecAttrAccount as String: "probe",
            kSecAttrService as String: "probe-svc",
            kSecValueData as String: Data([1]),
          ]
          if mode == "dp" { q[kSecUseDataProtectionKeychain as String] = true }
          let s = SecItemAdd(q as CFDictionary, nil)
          print(mode, "SecItemAdd status", s)
          SW
          swiftc k.swift -o k
          ent() { printf '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict>%s</dict></plist>' "$1" > "$2"; }
          ent '' none.plist
          ent '<key>keychain-access-groups</key><array><string>8N575942RT.com.screendead.penchant</string></array>' kag.plist
          ent '<key>com.apple.application-identifier</key><string>8N575942RT.com.screendead.penchant</string>' appid.plist
          ent '<key>com.apple.security.app-sandbox</key><true/><key>keychain-access-groups</key><array><string>8N575942RT.com.screendead.penchant</string></array>' sandbox.plist
          for v in none kag appid sandbox; do
            cp k k-$v
            codesign -f -s - --entitlements $v.plist k-$v || echo "codesign failed $v"
            echo "== $v dp"; ./k-$v dp; echo "exit $?"
            echo "== $v legacy"; ./k-$v legacy; echo "exit $?"
          done
          security list-keychains; security default-keychain
          csrutil status || true
