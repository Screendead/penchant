name: Checks
on:
  pull_request:
    branches:
      - master
  workflow_call:
permissions:
  contents: read
jobs:
  analyze_and_test:
    runs-on: ubuntu-latest
    concurrency:
      # head_ref is empty outside pull_request, so calls from the deploy workflow never cancel each other.
      group: checks-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      - name: Analyze
        run: dart analyze --fatal-infos --fatal-warnings
      - name: Test
        # A zone with daylight saving, so the day-arithmetic tests can fail.
        env:
          TZ: Europe/London
        run: flutter test
