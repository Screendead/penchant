name: Checks
on:
  pull_request:
    branches:
      - master
  workflow_call:
permissions:
  contents: read
jobs:
  analyze_and_test:
    runs-on: ubuntu-latest
    concurrency:
      # head_ref is empty outside pull_request, so calls from the deploy workflow never cancel each other.
      group: checks-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      - name: Format
        # Two files are skipped until their date-entry rework lands and is formatted; then check the directories whole.
        run: >
          find lib test integration_test -name '*.dart'
          ! -path lib/widgets/record_new_activity_dialog.dart
          ! -path lib/vice_activity_editor_page.dart
          | xargs dart format --output=none --set-exit-if-changed
      - name: Analyze
        run: dart analyze --fatal-infos --fatal-warnings
      - name: Test
        run: flutter test
