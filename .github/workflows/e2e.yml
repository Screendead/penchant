name: End to end
# integration_test/ against the Auth and Firestore emulators (demo-tracker), after merge rather than on PRs: on an iOS
# Simulator, and as a macOS app.
on:
  push:
    branches:
      - master
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "ideas/**"
      - "tech-debt/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A newer master commit cancels the older run, waiting or running, so a burst of merges tests only its last.
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-26
    # 74 minutes when flutter rebuilt the app for each file; all_test.dart builds it once.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Xcode's build database compares mtimes; a checkout's are all new (tools/ci-content-mtimes.py).
      - name: Content mtimes
        run: tools/ci-content-mtimes.py
      # The image has no "iPhone 18 Pro": take an iPhone on the newest iOS runtime.
      - name: Pick a simulator
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r '
            .devices | to_entries
            | map(select(.key | test("SimRuntime\\.iOS-")))
            | sort_by(.key | capture("iOS-(?<v>[0-9-]+)$").v | split("-") | map(tonumber))
            | last.value | map(select(.name | startswith("iPhone")))
            | (map(select(.name == "iPhone 17 Pro")) + .) | .[0].udid // empty')
          if [ -z "$udid" ]; then
            xcrun simctl list devices available
            echo "No available iPhone simulator." >&2
            exit 1
          fi
          xcrun simctl list devices available | grep "$udid"
          echo "E2E_DEVICE=$udid" >> "$GITHUB_ENV"
      # The runner's image, which the env context does not carry, for the Xcode cache key.
      - name: Image version
        run: echo "IMAGE=$ImageOS-$ImageVersion" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-flutter
      # firebase-tools refuses to start the emulators below Java 21.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: tests/firestore-rules/package-lock.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('tests/firestore-rules/package-lock.json') }}
      # The pub cache is subosito's (setup-flutter, cache: true), keyed on pubspec.lock.
      # Firebase's Swift packages, resolved by Package.resolved.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('ios/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      # Xcode's intermediates, mostly the compiled Firebase packages, with build/ios: Flutter clones the packages into
      # build/ios/SourcePackages (-clonedSourcePackagesDirPath) and Xcode puts built products there (SYMROOT), so
      # without it every run cloned firebase-ios-sdk again and rebuilt what the restored DerivedData held. Only an exact key is saved, so a
      # newer image, Flutter or dependency set saves its own; a partial restore is rebuilt by Xcode where stale.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            build/ios
          key: deriveddata-${{ env.IMAGE }}-${{ hashFiles('.github/actions/setup-flutter/action.yml', 'tools/ci-content-mtimes.py', 'pubspec.lock', 'ios/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            deriveddata-${{ env.IMAGE }}-
      # A first boot takes about three minutes; it carries on under the steps below, and tools/e2e.sh waits for it.
      # Started after the cache restores: booting during them slowed setup-flutter from about 1 minute to 5.
      - name: Boot the simulator
        run: xcrun simctl boot "$E2E_DEVICE"
      # The firebase-tools the rules tests run with, pinned by that lockfile; tools/e2e.sh calls `firebase`.
      - name: Install firebase-tools
        run: |
          npm --prefix tests/firestore-rules ci
          echo "$PWD/tests/firestore-rules/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Toolchain
        run: xcodebuild -version
      - name: End to end (iOS Simulator)
        # Two cold-cache runs hung after "Xcode build done" with no output (42716618867, 42733532556); stop early so
        # the step below can say where.
        timeout-minutes: 25
        env:
          # Every write the tests leave unacknowledged (offline, refused) waits out the timeout; 10 s in the app.
          E2E_FLUTTER_ARGS: --dart-define=WRITE_TIMEOUT_MS=5000
        run: |
          set -o pipefail
          tools/e2e.sh integration_test/all_test.dart 2>&1 | tee "$RUNNER_TEMP/e2e-ios.log"
      - name: Where a hung run stopped
        if: failure() || cancelled()
        run: |
          ps -axo pid,etime,command | grep -E 'flutter|xcrun|simctl|xcodebuild|Runner|devicectl' | grep -v grep || true
          xcrun simctl listapps "$E2E_DEVICE" 2>/dev/null | grep -A3 penchant || true
          xcrun simctl spawn "$E2E_DEVICE" log show --last 30m --style compact \
            --predicate 'process == "Runner" OR (process == "SpringBoard" AND eventMessage CONTAINS "penchant")' \
            > "$RUNNER_TEMP/simulator.log" 2>&1 || true
          tail -60 "$RUNNER_TEMP/simulator.log"
      - name: Cache sizes
        if: always()
        run: du -sh ~/Library/Caches/org.swift.swiftpm ~/Library/org.swift.swiftpm ~/Library/Developer/Xcode/DerivedData ~/.pub-cache build/ios 2>/dev/null || true
      # Which targets Xcode rebuilt, to check the build cache.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: xcode-build-log-ios
          path: |
            ~/Library/Developer/Xcode/DerivedData/*/Logs/Build/*.xcactivitylog
            ${{ runner.temp }}/e2e-ios.log
            ${{ runner.temp }}/simulator.log
          if-no-files-found: ignore
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-ios-log
          path: |
            ${{ runner.temp }}/e2e-ios.log
            *-debug.log
          if-no-files-found: ignore
  macos:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Content mtimes
        run: tools/ci-content-mtimes.py
      - name: Image version
        run: echo "IMAGE=$ImageOS-$ImageVersion" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-flutter
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: tests/firestore-rules/package-lock.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('tests/firestore-rules/package-lock.json') }}
      # As the iOS job's: build/macos holds the package checkouts (patched below) and the built products.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
            build/macos
          key: deriveddata-macos-${{ env.IMAGE }}-${{ hashFiles('.github/actions/setup-flutter/action.yml', 'tools/ci-content-mtimes.py', 'pubspec.lock', 'macos/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            deriveddata-macos-${{ env.IMAGE }}-
      - name: Install firebase-tools
        run: |
          npm --prefix tests/firestore-rules ci
          echo "$PWD/tests/firestore-rules/node_modules/.bin" >> "$GITHUB_PATH"
      # The runner has no Mac development profile, so the build is unsigned and has no keychain-access-groups
      # entitlement; an ad hoc signature carrying it is killed at launch (restricted without a profile). Firebase Auth
      # asks for the data-protection keychain, which needs that entitlement, so every sign-in fails with
      # keychain-error (-34018). The CI copy of the Firebase SDK asks for the file keychain instead, which an
      # unsigned app can use. Flutter builds from the packages resolved here (build/macos/SourcePackages).
      # flutter_secure_storage (the journal key) defaults to the data-protection keychain on macOS for the same reason,
      # so its option is forced off in the pub cache (with synchronizable queries, which need the entitlement too: a
      # delete of the synced item returns -34018), and flipped back in the last step so the cache post-step does not
      # save the edit for the iOS job.
      - name: Use the file keychain for Firebase Auth and the journal key
        run: |
          flutter pub get
          xcodebuild -resolvePackageDependencies -workspace macos/Runner.xcworkspace -scheme Runner \
            -clonedSourcePackagesDirPath build/macos/SourcePackages
          file=build/macos/SourcePackages/checkouts/firebase-ios-sdk/FirebaseAuth/Sources/Swift/Storage/AuthKeychainServices.swift
          # A cached checkout is already patched; rewriting it unchanged would still make Xcode rebuild FirebaseAuth.
          if grep -q kSecUseDataProtectionKeychain "$file"; then
            sed -i '' '/kSecUseDataProtectionKeychain/d' "$file"
          fi
          if grep -q kSecUseDataProtectionKeychain "$file"; then exit 1; fi
          plugin=$(realpath macos/Flutter/ephemeral/Packages/.packages/flutter_secure_storage_darwin-*/Sources/flutter_secure_storage_darwin/FlutterSecureStorage.swift)
          echo "$plugin" > "$RUNNER_TEMP/secure-storage-plugin"
          sed -i '' 's/, params.usesDataProtectionKeychain {/, false {/' "$plugin"
          grep -q 'macOS 10.15, \*), false {' "$plugin"
          sed -i '' 's/query\[kSecAttrSynchronizable\] = isSynchronizable/_ = isSynchronizable/' "$plugin"
          grep -q '_ = isSynchronizable' "$plugin"
      - name: End to end (macOS)
        env:
          E2E_DEVICE: macos
          FLUTTER_XCODE_CODE_SIGNING_ALLOWED: "NO"
        run: |
          set -o pipefail
          tools/e2e.sh integration_test/smoke_test.dart 2>&1 | tee "$RUNNER_TEMP/e2e-macos.log"
      - name: Restore the pub cache
        if: always()
        run: |
          plugin=$(cat "$RUNNER_TEMP/secure-storage-plugin" 2>/dev/null) || exit 0
          sed -i '' 's/macOS 10.15, \*), false {/macOS 10.15, *), params.usesDataProtectionKeychain {/' "$plugin"
          sed -i '' 's/_ = isSynchronizable/query[kSecAttrSynchronizable] = isSynchronizable/' "$plugin"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-macos-log
          path: |
            ${{ runner.temp }}/e2e-macos.log
            *-debug.log
          if-no-files-found: ignore
