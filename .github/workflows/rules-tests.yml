name: Firestore rules tests

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # The PR number is empty outside pull_request, so calls from the deploy workflow never cancel each other.
  group: rules-tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  rules-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tests/firestore-rules
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: tests/firestore-rules/package-lock.json
      # firebase-tools refuses to start the emulators below Java 21.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('tests/firestore-rules/package-lock.json') }}
      - run: npm ci
      - run: npm test
