<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App icon candidates</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3D5A80}a:hover{color:#22324a}
</style>
</helmet>
<div style="width: 1360px; min-height: 2200px; box-sizing: border-box; padding: 64px 72px; background: #F6F4EF; color: #1D1C1A; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 48px">
<header style="display: flex; flex-direction: column; gap: 10px">
<h1 style="margin: 0; font-size: 44px; font-weight: 700; letter-spacing: -0.02em">App icon candidates</h1>
<p style="margin: 0; font-size: 18px; color: #55524C; max-width: 900px">30 directions. Rows 1 to 4 work with any name; row 5 needs the brand call. Each is shown at App Store size and at Settings size. Pick by number.</p>
</header>
<sc-for list="{{sections}}" as="sec" hint-placeholder-count="5">
<section style="display: flex; flex-direction: column; gap: 20px">
<h2 style="margin: 0; font-size: 20px; font-weight: 600; color: #3B3934">{{sec.title}}</h2>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 28px">
<sc-for list="{{sec.items}}" as="item" hint-placeholder-count="6">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: flex-end; gap: 12px">
<img src="{{item.src}}" alt="{{item.label}}" style="width: 132px; height: 132px; border-radius: 30px; box-shadow: 0 1px 2px rgba(0,0,0,0.08), 0 6px 18px rgba(0,0,0,0.08)">
<img src="{{item.src}}" alt="" style="width: 40px; height: 40px; border-radius: 9px">
</div>
<div style="font-size: 15px; font-weight: 600"><span style="color: #8A867E; font-variant-numeric: tabular-nums">{{item.n}}</span>  {{item.name}}</div>
<div style="font-size: 13px; line-height: 1.4; color: #55524C">{{item.desc}}</div>
</div>
</sc-for>
</div>
</section>
</sc-for>
<section style="display: flex; flex-direction: column; gap: 20px">
<h2 style="margin: 0; font-size: 20px; font-weight: 600; color: #3B3934">At home-screen size, on dark and light wallpaper</h2>
<div style="background: #1B1B1F; border-radius: 24px; padding: 28px; display: grid; grid-template-columns: repeat(15, 56px); gap: 16px 18px; justify-content: center">
<sc-for list="{{all}}" as="item" hint-placeholder-count="30">
<img src="{{item.src}}" alt="{{item.label}}" style="width: 56px; height: 56px; border-radius: 13px">
</sc-for>
</div>
<div style="background: #E4DFD4; border-radius: 24px; padding: 28px; display: grid; grid-template-columns: repeat(15, 56px); gap: 16px 18px; justify-content: center">
<sc-for list="{{all}}" as="item" hint-placeholder-count="30">
<img src="{{item.src}}" alt="{{item.label}}" style="width: 56px; height: 56px; border-radius: 13px">
</sc-for>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":2200}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [
      ["The Today radar: the app's own picture", [
        ["01", "web", "Web", "The radar with its rings. Reads as a chart."],
        ["02", "bloom", "Bloom", "The day's shape, softened into a pebble."],
        ["03", "outline", "Outline", "Only the line and its points, on teal."],
        ["04", "prism", "Prism", "A colour per axis: many habits, one day."],
        ["05", "day-page", "Day page", "A calendar leaf with the day's shape on it."],
        ["06", "glow", "Glow", "The shape alone on a warm gradient."]
      ]],
      ["Counting", [
        ["07", "tally", "Tally", "Four and a slash: the oldest way to count."],
        ["08", "days", "Days", "A month of dots, filling in."],
        ["09", "bars", "Trend", "Bars and the moving average from the graph tab."],
        ["10", "one", "One", "A single entry. Log one, nothing more."],
        ["11", "abacus", "Abacus", "Counting beads, pushed along."],
        ["12", "counts", "Counts", "Three habits as bars of different lengths."]
      ]],
      ["The journal", [
        ["13", "notebook", "Notebook", "A diary with a ribbon marker."],
        ["14", "ruled", "Ruled", "A written line on ruled paper."],
        ["15", "cup-ring", "Cup ring", "The mark a daily habit leaves."],
        ["16", "hourglass", "Hourglass", "Time, and where it went."],
        ["17", "whorl", "Whorl", "A fingerprint: patterns that are yours."],
        ["18", "phases", "Phases", "Cycles that come round again."]
      ]],
      ["Patterns and leanings", [
        ["19", "wave", "Line", "Points joined over time."],
        ["20", "rings", "Rings", "Growth rings, read afterwards."],
        ["21", "pendulum", "Pendulum", "A swing one way, then back."],
        ["22", "compass", "Compass", "Which way you are heading."],
        ["23", "level", "Level", "A bubble a little off centre: a leaning."],
        ["24", "steps", "Steps", "Progress, one step at a time."]
      ]],
      ["Lettermarks for the brand candidates", [
        ["25", "p-bowl", "P", "Penchant, as a plain capital."],
        ["26", "p-lean", "p, tipped", "Penchant, the p leaning forward."],
        ["27", "k-point", "k", "Kenning: two arms that meet at a point."],
        ["28", "s-sound", "S", "Sounding, with a plumb line."],
        ["29", "t-tend", "T, tilted", "Tendency, set at a lean."],
        ["30", "l-lean", "L", "Leaning, in one stroke."]
      ]]
    ];
    const sections = rows.map(([title, items]) => ({
      title,
      items: items.map(([n, slug, name, desc]) => ({
        n, name, desc, label: n + " " + name, src: "icons/" + n + "-" + slug + ".svg"
      }))
    }));
    const all = sections.flatMap((s) => s.items);
    return { sections, all };
  }
}
</script>
</body>
</html>
