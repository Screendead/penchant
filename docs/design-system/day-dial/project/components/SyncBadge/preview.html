<!-- @dsCard group="Status" height=170 subtitle="The app bar's sync state, and the per-entry not-yet-synced mark" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@700;900&family=Red+Hat+Mono:wght@400;500&family=Red+Hat+Text:wght@400;500;600&display=swap">
<style>
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-text); -webkit-font-smoothing: antialiased; }
  .wrap { display: flex; gap: 40px; justify-content: center; padding: 24px var(--space-gutter); align-items: flex-start; }
  .col { width: 390px; display: flex; flex-direction: column; gap: var(--space-xs); }
  svg.i { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .bar { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px 0 14px; }
  .word { display: flex; align-items: center; gap: 8px; padding: 6px 10px; font: 900 21px/1 var(--font-display); letter-spacing: -.3px; }
  .word svg.i { width: 16px; height: 16px; color: var(--muted); }
  .badge { display: flex; align-items: center; gap: 6px; font: 500 12px/1 var(--font-text); color: var(--muted); height: 32px; padding: 0 10px; border-radius: var(--radius-pill); }
  .badge svg.i { width: 18px; height: 18px; }
  .erow { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-card); display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 18px 0 14px; }
  .erow svg.b { width: 30px; height: 30px; flex: none; }
  .bp { fill: none; stroke: var(--data1); stroke-width: 2; stroke-dasharray: 3.2 2.6; }
  .et { font: 500 15px/1 var(--font-mono); }
  .eq { margin-left: auto; font: 500 15px/1 var(--font-text); text-align: right; }
  .ep { font: 400 12px/1 var(--font-text); color: var(--muted); margin-top: 4px; display: flex; gap: 4px; align-items: center; justify-content: flex-end; }
  .ep svg.i { width: 13px; height: 13px; }
</style>
</head>
<body>
<div id="root" class="wrap"></div>
<script>
  const P = { down: '<path d="M6 9l6 6 6-6"/>', cloudok: '<path d="M7 18a4.5 4.5 0 01-.6-8.96A6 6 0 0118 9.5a4 4 0 01-1 8.5z"/><path d="M9.5 13.5l2 2 3.5-3.5"/>', cloudoff: '<path d="M3 3l18 18"/><path d="M9.3 5.4A6 6 0 0118 9.5a4 4 0 012.3 7.2M17 18H7a4.5 4.5 0 01-1.7-8.66"/>', cloudup: '<path d="M7 18a4.5 4.5 0 01-.6-8.96A6 6 0 0118 9.5a4 4 0 01-1 8.5"/><path d="M12 12v7M9.5 14.5L12 12l2.5 2.5"/>' };
  const ic = n => `<svg class="i" viewBox="0 0 24 24">${P[n]}</svg>`;
  const bar = (icon, label) => `<div class="bar"><span class="word">Tracker${ic('down')}</span><span class="badge" role="status">${ic(icon)}<span>${label}</span></span></div>`;
  document.getElementById('root').innerHTML =
    `<div class="col">${bar('cloudok', 'Synced')}${bar('cloudoff', 'Offline')}</div>` +
    `<div class="col"><div class="erow"><svg class="b" viewBox="-15 -15 30 30"><circle class="bp" r="6.5"/></svg><span class="et">15:50</span><div class="eq">1 drink<div class="ep">${ic('cloudup')}Not yet synced</div></div></div></div>`;
</script>
</body>
</html>
