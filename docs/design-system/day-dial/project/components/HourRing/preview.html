<!-- @dsCard group="Trends" height=170 subtitle="When a habit happens by hour: the Trends panel and the history summary card" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@700;900&family=Red+Hat+Mono:wght@400;500&family=Red+Hat+Text:wght@400;500;600&display=swap">
<style>
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-text); -webkit-font-smoothing: antialiased; }
  .wrap { display: flex; gap: 40px; justify-content: center; align-items: center; padding: 24px var(--space-gutter); }
  .when { width: 350px; display: flex; gap: 14px; align-items: center; background: var(--surface2); border-radius: 22px; padding: 12px 14px; box-sizing: border-box; }
  .when svg { width: 96px; height: 96px; flex: none; }
  .wt { font: 600 14px/1.3 var(--font-text); }
  .ws { font: 400 12.5px/1.4 var(--font-text); color: var(--muted); margin-top: 4px; }
  .card { width: 350px; display: flex; gap: 16px; align-items: center; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-card); box-shadow: var(--shadow-card); box-sizing: border-box; }
  .card svg { width: 92px; height: 92px; flex: none; }
  .sl { font: 500 12px/1 var(--font-text); color: var(--muted); }
  .sv { font: 500 24px/1 var(--font-mono); margin-top: 6px; }
  .sv small { font: 500 13px/1 var(--font-text); color: var(--muted); }
  .ss { font: 400 13px/1.35 var(--font-text); color: var(--muted); margin-top: 6px; }
  .face { fill: var(--surface); } .base { fill: none; stroke: var(--line); } .tick { stroke: var(--spoke); stroke-width: 1; }
  .bars { fill: var(--data1); }
  .lab { font: 700 9px/1 var(--font-display); fill: var(--muted); }
</style>
</head>
<body>
<div id="root" class="wrap"></div>
<script>
  const ang = m => m / 1440 * Math.PI * 2 - Math.PI / 2, pad = n => String(n).padStart(2, '0');
  const bins = new Array(24).fill(0);
  Object.entries({ 6: 8, 7: 20, 8: 16, 9: 14, 10: 9, 11: 6, 12: 4, 13: 5, 14: 4, 15: 3, 16: 2, 17: 1 }).forEach(([h, v]) => bins[h] = v);
  const mx = Math.max(...bins), P = (r, a) => `${(r * Math.cos(a)).toFixed(1)},${(r * Math.sin(a)).toFixed(1)}`;
  let d = '';
  bins.forEach((v, i) => {
    if (!v) return; const a0 = ang(i * 60 + 6), a1 = ang(i * 60 + 54), r0 = 26, r1 = 26 + 20 * v / mx;
    d += `M${P(r0, a0)}L${P(r1, a0)}A${r1},${r1} 0 0 1 ${P(r1, a1)}L${P(r0, a1)}A${r0},${r0} 0 0 0 ${P(r0, a0)}Z`;
  });
  const ticks = [0, 6, 12, 18].map(h => { const a = ang(h * 60); return `<line class="tick" x1="${18 * Math.cos(a)}" y1="${18 * Math.sin(a)}" x2="${48 * Math.cos(a)}" y2="${48 * Math.sin(a)}"/>`; }).join('');
  const ring = `<svg viewBox="-50 -50 100 100" role="img" aria-label="Coffee by hour, mostly 07:00 to 10:00"><circle class="face" r="47"/><circle class="base" r="26"/>${ticks}<path class="bars" d="${d}"/><text class="lab" y="1" text-anchor="middle" dominant-baseline="central">24 h</text></svg>`;
  let best = 0, bi = 0; for (let i = 0; i < 24; i++) { const s = bins[i] + bins[(i + 1) % 24] + bins[(i + 2) % 24]; if (s > best) { best = s; bi = i; } }
  const tot = bins.reduce((a, b) => a + b, 0), am = Math.round(bins.slice(0, 12).reduce((a, b) => a + b, 0) / tot * 100);
  const peak = `Mostly ${pad(bi)}:00–${pad((bi + 3) % 24)}:00`;
  document.getElementById('root').innerHTML =
    `<div class="when">${ring}<div><div class="wt">${peak}</div><div class="ws">When coffee happens, over the last 30 days. ${am}% of it before noon.</div></div></div>` +
    `<div class="card">${ring}<div><div class="sl">Last 30 days</div><div class="sv">${tot} <small>drinks</small></div><div class="ss">${peak}</div></div></div>`;
</script>
</body>
</html>
