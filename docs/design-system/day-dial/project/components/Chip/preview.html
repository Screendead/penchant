<!-- @dsCard group="Controls" height=170 subtitle="Habit chips in Trends: one selected, an archived habit last" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@700;900&family=Red+Hat+Mono:wght@400;500&family=Red+Hat+Text:wght@400;500;600&display=swap">
<style>
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-text); -webkit-font-smoothing: antialiased; }
  .panel { margin: 20px 40px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-card); padding: var(--space-l); display: flex; flex-direction: column; gap: var(--space-s); }
  .chips { display: flex; gap: var(--space-xs); flex-wrap: wrap; }
  .c1 { --c: var(--data1); --ci: var(--data1Ink); } .c2 { --c: var(--data2); --ci: var(--data2Ink); } .c3 { --c: var(--data3); --ci: var(--data3Ink); }
  .c4 { --c: var(--data4); --ci: var(--data4Ink); } .c5 { --c: var(--data5); --ci: var(--data5Ink); }
  .chip { height: var(--size-chipHeight); padding: 0 14px 0 11px; border-radius: var(--radius-pill); display: inline-flex; align-items: center; gap: 7px; font: 600 13px/1 var(--font-text); background: var(--surface2); white-space: nowrap; border: 1.5px solid transparent; box-sizing: border-box; }
  .chip[aria-pressed="true"] { background: color-mix(in srgb, var(--c) 18%, var(--surface)); border-color: var(--ci); }
  .pip { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
  .pip.ring { background: none; box-shadow: inset 0 0 0 2.2px var(--c); }
  .arch { color: var(--muted); font-weight: 500; }
</style>
</head>
<body>
<div id="root" class="panel"></div>
<script>
  const H = [['Coffee', 1], ['Takeaway', 2], ['Alcohol', 3], ['Late nights', 4], ['Doomscrolling', 5], ['Sugar', 1, true]];
  const row = sel => `<div class="chips">${H.map(([n, c, arch], i) => `<span class="chip c${c}" aria-pressed="${i === sel}"><span class="pip${arch ? ' ring' : ''}"></span>${n}${arch ? '<span class="arch">· archived</span>' : ''}</span>`).join('')}</div>`;
  document.getElementById('root').innerHTML = row(0) + row(4);
</script>
</body>
</html>
