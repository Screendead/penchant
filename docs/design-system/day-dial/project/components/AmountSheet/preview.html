<!-- @dsCard group="Recording" height=520 subtitle="Hold a wedge: set the amount, drag the hand to the time, log" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@700;900&family=Red+Hat+Mono:wght@400;500&family=Red+Hat+Text:wght@400;500;600&display=swap">
<style>
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-text); -webkit-font-smoothing: antialiased; }
  .wrap { display: flex; justify-content: center; padding: 20px var(--space-gutter) 0; }
  .sheet { width: 390px; background: var(--surface); border: 1px solid var(--line); border-bottom: 0; border-radius: var(--radius-sheet) var(--radius-sheet) 0 0; box-shadow: var(--shadow-sheet); padding: 12px 22px var(--space-xxl); box-sizing: border-box; }
  .grab { width: 38px; height: 5px; border-radius: 3px; background: var(--outline); margin: 0 auto 14px; }
  .head { display: flex; align-items: center; justify-content: space-between; }
  .ttl { display: flex; align-items: center; gap: 10px; font: 700 20px/1 var(--font-display); }
  .pip { width: 12px; height: 12px; border-radius: 50%; background: var(--data1); box-shadow: inset 0 0 0 1.25px var(--data1Rim); }
  .x { width: 36px; height: 36px; border-radius: 50%; background: var(--surface2); display: grid; place-items: center; }
  svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  .stepper { display: flex; align-items: center; justify-content: space-between; margin: 18px 6px 6px; }
  .step { width: 56px; height: 56px; border-radius: 50%; background: var(--surface2); display: grid; place-items: center; }
  .step svg.i { width: 22px; height: 22px; }
  .val { text-align: center; }
  .val .n { font: 500 40px/44px var(--font-mono); }
  .val .u { display: block; font: 500 14px/1 var(--font-text); color: var(--muted); margin-top: 4px; }
  svg.mini { display: block; width: 216px; height: 216px; margin: 10px auto 0; overflow: visible; }
  .disc { fill: var(--surface); } .rim { fill: none; stroke: var(--line); }
  .spoke { stroke: var(--spoke); stroke-width: 1; stroke-linecap: round; opacity: .45; } .spoke.maj { stroke-width: 1.4; opacity: 1; }
  .numeral { font: 700 12px/1 var(--font-display); letter-spacing: .6px; fill: var(--muted); }
  .hub { fill: var(--bg); } .hub-t1 { font: 500 21px/1 var(--font-mono); fill: var(--text); }
  .c1 { --c: var(--data1); --ci: var(--data1Ink); } .c2 { --c: var(--data2); --ci: var(--data2Ink); } .c4 { --c: var(--data4); --ci: var(--data4Ink); } .c5 { --c: var(--data5); --ci: var(--data5Ink); }
  .ghost .bf { fill: var(--c); fill-opacity: .4; } .ghost .br { fill: none; stroke: var(--ci); stroke-width: 1.25; }
  .knob { fill: var(--accent); stroke: var(--surface); stroke-width: 3; }
  .shand { stroke: var(--accent); stroke-width: 3; stroke-linecap: round; }
  .meta { text-align: center; font: 400 12.5px/1.4 var(--font-text); color: var(--muted); margin-top: 6px; }
  .meta u { color: var(--text); font-weight: 600; text-underline-offset: 3px; text-decoration-color: var(--muted); }
  .go { height: var(--size-pillHeight); border-radius: var(--radius-pill); background: var(--accent); color: var(--onAccent); font: 600 16px/1 var(--font-text); display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 14px; }
  .go .m { font: 500 17px/1 var(--font-mono); }
</style>
</head>
<body>
<div id="root" class="wrap"></div>
<script>
  const TAU = Math.PI * 2, ang = m => m / 1440 * TAU - Math.PI / 2;
  const P = { x: '<path d="M6 6l12 12M18 6L6 18"/>', minus: '<path d="M5 12h14"/>', plus: '<path d="M12 5v14M5 12h14"/>' };
  const ic = n => `<svg class="i" viewBox="0 0 24 24">${P[n]}</svg>`;
  const typ = [1, 2, 1, 1, 20], col = [1, 2, 3, 4, 5], TRACK = [100, 116, 84, 68];
  const day = [[3, 40, 1], [0, 425, 1], [4, 440, 15], [0, 580, 1], [1, 770, 2], [4, 1005, 10]];
  let s = '<svg class="mini" viewBox="-160 -160 320 320"><circle class="disc" r="124"/><circle class="rim" r="124"/>';
  for (let i = 0; i < 24; i++) { const maj = i % 3 === 0, a = ang(i * 60), r0 = maj ? 54 : 64, r1 = maj ? 140 : 132; s += `<line class="spoke${maj ? ' maj' : ''}" x1="${r0 * Math.cos(a)}" y1="${r0 * Math.sin(a)}" x2="${r1 * Math.cos(a)}" y2="${r1 * Math.sin(a)}"/>`; }
  for (const h of [0, 6, 12, 18]) { const a = ang(h * 60); s += `<text class="numeral" x="${152 * Math.cos(a)}" y="${152 * Math.sin(a) + .5}" text-anchor="middle" dominant-baseline="central">${String(h).padStart(2, '0')}</text>`; }
  const seen = new Map();
  for (const [h, min, q] of day) {
    const k = h + ':' + Math.floor(min / 60), n = seen.get(k) || 0; seen.set(k, n + 1);
    const a = ang(min), R = TRACK[n % 4], r = Math.max(5, Math.min(14, 7.5 * Math.sqrt(q / typ[h])));
    s += `<g class="ghost c${col[h]}" transform="translate(${R * Math.cos(a)},${R * Math.sin(a)})"><circle class="bf" r="${r}"/><circle class="br" r="${r - .5}"/></g>`;
  }
  const a = ang(18 * 60 + 30), x = 112 * Math.cos(a), y = 112 * Math.sin(a);
  s += `<circle class="hub" r="44"/><text class="hub-t1" text-anchor="middle" y="7">18:30</text>`;
  s += `<line class="shand" x1="${x * .42}" y1="${y * .42}" x2="${x * .9}" y2="${y * .9}"/><circle class="knob" r="11" cx="${x}" cy="${y}"/></svg>`;
  document.getElementById('root').innerHTML = `<div class="sheet" role="dialog" aria-label="Log Coffee"><div class="grab"></div>
    <div class="head"><div class="ttl"><span class="pip"></span>Coffee</div><span class="x" aria-label="Close">${ic('x')}</span></div>
    <div class="stepper"><span class="step" aria-label="Less">${ic('minus')}</span><div class="val"><span class="n">2</span><span class="u">drinks</span></div><span class="step" aria-label="More">${ic('plus')}</span></div>
    ${s}<div class="meta">2 h 40 min ago · <u>Now</u></div>
    <div class="go">Log <span class="m">2</span> drinks at <span class="m">18:30</span></div></div>`;
</script>
</body>
</html>
