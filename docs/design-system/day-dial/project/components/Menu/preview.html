<!-- @dsCard group="Pages" height=250 subtitle="The wordmark's popover: the way to Habits and Settings, with the sync summary" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@700;900&family=Red+Hat+Mono:wght@400;500&family=Red+Hat+Text:wght@400;500;600&display=swap">
<style>
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-text); -webkit-font-smoothing: antialiased; }
  .stage { position: relative; width: 390px; margin: 12px auto 0; height: 230px; }
  svg.i { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .word { position: absolute; top: 0; left: 14px; display: flex; align-items: center; gap: 8px; padding: 6px 10px; font: 900 21px/1 var(--font-display); letter-spacing: -.3px; }
  .word svg.i { width: 16px; height: 16px; color: var(--muted); }
  .menu { position: absolute; top: 46px; left: 14px; width: 244px; background: var(--surface); border-radius: var(--radius-card); box-shadow: var(--shadow-pop); border: 1px solid var(--line); padding: 8px; box-sizing: border-box; }
  .mi { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; font: 500 15.5px/1 var(--font-text); }
  .mi.hover { background: var(--surface2); }
  .mi svg.i { width: 20px; height: 20px; color: var(--muted); }
  .mdiv { height: 1px; background: var(--line); margin: 4px 12px; }
  .mfoot { display: flex; gap: 8px; align-items: center; padding: 10px 12px 8px; font: 400 12.5px/1.3 var(--font-text); color: var(--muted); }
  .mfoot svg.i { width: 16px; height: 16px; flex: none; }
  .mfoot .m { font-family: var(--font-mono); }
</style>
</head>
<body>
<div id="root" class="stage"></div>
<script>
  const P = { down: '<path d="M6 9l6 6 6-6"/>', grid: '<circle cx="12" cy="12" r="8"/><path d="M12 4v4M20 12h-4M12 20v-4M4 12h4"/>', gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/>', cloudok: '<path d="M7 18a4.5 4.5 0 01-.6-8.96A6 6 0 0118 9.5a4 4 0 01-1 8.5z"/><path d="M9.5 13.5l2 2 3.5-3.5"/>' };
  const ic = n => `<svg class="i" viewBox="0 0 24 24">${P[n]}</svg>`;
  document.getElementById('root').innerHTML = `<span class="word">Penchant${ic('down')}</span><div class="menu" role="menu"><div class="mi hover" role="menuitem">${ic('grid')}Habits</div><div class="mi" role="menuitem">${ic('gear')}Settings</div><div class="mdiv"></div><div class="mfoot">${ic('cloudok')}<span>All entries synced · last at <span class="m">21:08</span></span></div></div>`;
</script>
</body>
</html>
