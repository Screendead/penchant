<!-- @dsCard group="Today" height=530 subtitle="The day nav over the dial, and the calendar sheet the date pill opens" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@700;900&family=Red+Hat+Mono:wght@400;500&family=Red+Hat+Text:wght@400;500;600&display=swap">
<style>
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-text); -webkit-font-smoothing: antialiased; }
  .wrap { display: flex; gap: 48px; padding: 24px var(--space-gutter); align-items: flex-start; justify-content: center; }
  .col { width: 350px; display: flex; flex-direction: column; gap: var(--space-m); }
  .cap { font: 600 13px/18px var(--font-text); color: var(--muted); margin-bottom: -8px; }
  svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .nav { display: flex; align-items: center; justify-content: space-between; height: 44px; }
  .cbtn { width: var(--size-circleButton); height: var(--size-circleButton); border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-card); color: var(--text); box-sizing: border-box; }
  .cbtn[disabled] { opacity: .35; }
  .pill { height: 44px; padding: 0 18px; border-radius: var(--radius-pill); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-card); display: flex; align-items: center; gap: var(--space-xs); box-sizing: border-box; }
  .pill b { font: 700 17px/1 var(--font-display); }
  .pill span { font: 500 14px/1 var(--font-text); color: var(--muted); }
  .pill svg.i { width: 14px; height: 14px; color: var(--muted); }
  .sheet { width: 390px; background: var(--surface); border: 1px solid var(--line); border-bottom: 0; border-radius: var(--radius-sheet) var(--radius-sheet) 0 0; box-shadow: var(--shadow-sheet); padding: 12px 22px var(--space-xxl); box-sizing: border-box; }
  .grab { width: 38px; height: 5px; border-radius: 3px; background: var(--text); opacity: .18; margin: 0 auto 14px; }
  .head { display: flex; justify-content: space-between; align-items: center; }
  .head h3 { margin: 0; font: 700 20px/1 var(--font-display); }
  .head div { display: flex; gap: var(--space-xs); }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px 0; margin-top: 14px; }
  .wd { font: 600 11px/1 var(--font-text); color: var(--muted); text-align: center; padding-bottom: 8px; }
  .day { height: 50px; display: flex; flex-direction: column; align-items: center; gap: 5px; padding-top: 6px; box-sizing: border-box; }
  .day .n { font: 500 15px/1 var(--font-mono); width: 30px; height: 26px; display: grid; place-items: center; border-radius: var(--radius-pill); }
  .day.today .n { box-shadow: inset 0 0 0 1.5px var(--accent); font-weight: 600; }
  .day.sel .n { background: var(--accent); color: var(--onAccent); box-shadow: none; }
  .day.fut { opacity: .3; }
  .dots { display: flex; gap: 2px; height: 4px; }
  .dots i { width: 4px; height: 4px; border-radius: 50%; }
  .foot { font: 400 12px/1.4 var(--font-text); color: var(--muted); text-align: center; margin-top: 10px; }
</style>
</head>
<body>
<div id="root" class="wrap"></div>
<script>
  const P = { left: '<path d="M15 18l-6-6 6-6"/>', right: '<path d="M9 18l6-6-6-6"/>', down: '<path d="M6 9l6 6 6-6"/>' };
  const ic = n => `<svg class="i" viewBox="0 0 24 24">${P[n]}</svg>`;
  const nav = (day, date, nextOff) => `<div class="nav"><span class="cbtn">${ic('left')}</span><span class="pill"><b>${day}</b><span>${date}</span>${ic('down')}</span><span class="cbtn"${nextOff ? ' disabled' : ''}>${ic('right')}</span></div>`;
  let h = '';
  for (const w of ['M', 'T', 'W', 'T', 'F', 'S', 'S']) h += `<div class="wd">${w}</div>`;
  for (let i = 0; i < 6; i++) h += '<div></div>';
  const pick = (d, k) => ((d * 7919 + k * 104729) % 97) / 97;
  for (let d = 1; d <= 30; d++) {
    const fut = d > 5, cls = `day${d === 5 ? ' today' : ''}${d === 3 ? ' sel' : ''}${fut ? ' fut' : ''}`;
    let dots = '';
    if (!fut && d !== 3) for (let k = 1; k <= 5; k++) if (k === 1 || pick(d, k) < .5) dots += `<i style="background:var(--data${k})"></i>`;
    h += `<div class="${cls}"><span class="n">${d}</span><span class="dots">${dots}</span></div>`;
  }
  document.getElementById('root').innerHTML =
    `<div class="col"><div class="cap">Today: forward is disabled</div>${nav('Today', 'Thu 5 Nov', true)}<div class="cap">A past day</div>${nav('Tuesday', '3 Nov', false)}</div>` +
    `<div class="sheet"><div class="grab"></div><div class="head"><h3>November 2026</h3><div><span class="cbtn">${ic('left')}</span><span class="cbtn" disabled>${ic('right')}</span></div></div><div class="grid">${h}</div><div class="foot">A dot for each habit logged that day. Tap a day to open its dial.</div></div>`;
</script>
</body>
</html>
