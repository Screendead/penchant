<!-- @dsCard group="Pages" height=470 subtitle="Cards of rows: the Habits list, a history day with a swipe in progress, Settings" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@700;900&family=Red+Hat+Mono:wght@400;500&family=Red+Hat+Text:wght@400;500;600&display=swap">
<style>
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-text); -webkit-font-smoothing: antialiased; }
  .wrap { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-xl); padding: 16px var(--space-xl); }
  svg.i { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .card { background: var(--surface); border-radius: var(--radius-card); box-shadow: var(--shadow-card); border: 1px solid var(--line); overflow: hidden; }
  .sect { font: 600 13px/1 var(--font-text); color: var(--muted); margin: 18px 6px 10px; }
  .sect:first-child { margin-top: 4px; }
  .c1 { --c: var(--data1); --ci: var(--data1Ink); --cr: var(--data1Rim); } .c2 { --c: var(--data2); --ci: var(--data2Ink); --cr: var(--data2Rim); } .c3 { --c: var(--data3); --ci: var(--data3Ink); --cr: var(--data3Rim); }
  .c4 { --c: var(--data4); --ci: var(--data4Ink); --cr: var(--data4Rim); } .c5 { --c: var(--data5); --ci: var(--data5Ink); --cr: var(--data5Rim); }
  .pip { width: 14px; height: 14px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1.25px var(--cr); flex: none; }
  .pip.ring { background: none; box-shadow: inset 0 0 0 2.2px var(--ci); }
  .hrow { display: flex; align-items: center; gap: 14px; padding: 0 14px 0 18px; height: 66px; position: relative; }
  .hrow + .hrow:before, .srow + .srow:before, .ew + .ew:before { content: ""; position: absolute; top: 0; right: 0; height: 1px; background: var(--line); z-index: 2; }
  .hrow + .hrow:before { left: 44px; } .srow + .srow:before { left: 18px; } .ew + .ew:before { left: 56px; }
  .hb { flex: 1; min-width: 0; } .hn { font: 500 16px/1.2 var(--font-text); } .hs { font: 400 13px/1.3 var(--font-text); color: var(--muted); margin-top: 3px; }
  .chev { width: 18px; height: 18px; color: var(--muted); }
  .dayhead { display: flex; justify-content: space-between; font: 600 13px/1 var(--font-text); color: var(--muted); margin: 4px 6px 10px; }
  .dayhead .m, .et { font-family: var(--font-mono); font-weight: 500; }
  .ew { position: relative; overflow: hidden; }
  .del { position: absolute; inset: 0; background: var(--danger); display: flex; align-items: center; justify-content: flex-end; padding-right: 22px; color: var(--surface); }
  .del svg.i { width: 22px; height: 22px; }
  .erow { position: relative; z-index: 1; background: var(--surface); display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 18px 0 14px; }
  .erow svg.b { width: 30px; height: 30px; flex: none; }
  .bf { fill: var(--c); } .br { fill: none; stroke: var(--cr); stroke-width: 1.25; }
  .et { font-size: 15px; }
  .eq { margin-left: auto; font: 500 15px/1 var(--font-text); }
  .srow { display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 18px; font: 500 16px/1 var(--font-text); position: relative; }
  .sv2 { font: 400 14px/1 var(--font-text); color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .sv2 svg.i { width: 18px; height: 18px; }
  .sv2 .m { font-family: var(--font-mono); }
  .danger { color: var(--danger); }
  .foot { font: 400 12.5px/1.5 var(--font-text); color: var(--muted); margin: 12px 6px 0; }
</style>
</head>
<body>
<div id="root" class="wrap"></div>
<script>
  const P = { right: '<path d="M9 18l6-6-6-6"/>', trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12M9 7V4h6v3"/>', share: '<path d="M12 3v12M7.5 7.5L12 3l4.5 4.5"/><path d="M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/>' };
  const ic = (n, c = '') => `<svg class="i ${c}" viewBox="0 0 24 24">${P[n]}</svg>`;
  const hrow = (c, n, s, ring) => `<div class="hrow c${c}"><span class="pip${ring ? ' ring' : ''}"></span><div class="hb"><div class="hn">${n}</div><div class="hs">${s}</div></div>${ic('right', 'chev')}</div>`;
  const bead = (c, r = 6.5) => `<svg class="b" viewBox="-15 -15 30 30"><g class="c${c}"><circle class="bf" r="${r}"/><circle class="br" r="${r - .5}"/></g></svg>`;
  const erow = (t, q, dx = 0) => `<div class="ew"><div class="del">${ic('trash')}</div><div class="erow c3" style="transform:translateX(${dx}px)">${bead(3)}<span class="et">${t}</span><span class="eq">${q}</span></div></div>`;
  const srow = (l, v, icon, cls = '') => `<div class="srow ${cls}"><span>${l}</span><span class="sv2">${v}${icon ? ic(icon) : ''}</span></div>`;
  document.getElementById('root').innerHTML =
    `<div><div class="sect">Habits · 5 active · 1 archived</div><div class="card">${hrow(1, 'Coffee', 'drinks · 1,287 entries')}${hrow(2, 'Takeaway', 'items · 291 entries')}${hrow(3, 'Alcohol', 'drinks · 325 entries')}</div>` +
    `<div class="sect">Archived</div><div class="card">${hrow(1, 'Sugar', 'items · 386 entries', true)}</div><div class="foot">Colours follow the order habits were added, archived ones included.</div></div>` +
    `<div><div class="dayhead"><span>Today</span><span><span class="m">4</span> drinks</span></div><div class="card">${erow('20:50', '1 drink')}${erow('19:30', '2 drinks', -96)}${erow('18:40', '1 drink')}</div><div class="foot">Swipe an entry left to delete it. Tap it to edit.</div></div>` +
    `<div><div class="sect">Account</div><div class="card">${srow('Account', 'sam@example.com', 'right')}${srow('Export my data', 'CSV, JSON', 'share')}</div>` +
    `<div class="sect">App</div><div class="card">${srow('Appearance', 'Match system', 'right')}${srow('About', '<span class="m">0.2.0 (212)</span>')}</div>` +
    `<div class="card" style="margin-top:var(--space-m)">${srow('Sign out', '', null, 'danger')}</div></div>`;
</script>
</body>
</html>
